name: Pinned real mesh audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-pinned-assets:
    name: Audit exact pinned MakeHuman assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run verified pinned-asset audit
        run: |
          node prototype/real-mesh/audit/pinned-real-mesh-audit.mjs \
            --output artifacts/pinned-real-mesh-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-real-mesh-audit
          path: artifacts/pinned-real-mesh-audit.json
          if-no-files-found: warn
