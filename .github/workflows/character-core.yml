name: Character Core

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "schema/**"
      - "tests/core/**"
      - ".github/workflows/character-core.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "schema/**"
      - "tests/core/**"
      - ".github/workflows/character-core.yml"

permissions:
  contents: read

jobs:
  test-core:
    name: Test Character Core
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Character Core dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Character Core contract tests
        run: npm run test:core

  cross-validator:
    name: Cross-check JSON Schema validators
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python schema dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Python schema contract tests
        run: python -m unittest discover -s tests -p "test_schema_contract.py" -v
